<style>

<header><b>3W · Fotos de campo</b><span>Envie as fotos da caixa direto para o escritório · funciona sem sinal</span></header>

<script>

var $=function(i){return document.getElementById(i)},fotos={},gps=null,pos=null,end={txt:'',lat:null,lon:null,busca:null,cidade:'',uf:''},cidManual=false,ultOp=null,mostrarEnv=false,restaurando=false;

if(c)ROT[c.tipo].forEach(function(r,i){var d=document.createElement('div');d.className='slot'+(fotos[i]?' ok':'');

[].forEach.call(d.querySelectorAll('input'),function(inp){inp.onchange=function(){if(this.files[0])preparar(i,this.files[0],this.dataset.o);this.value=''}});

$('slots').appendChild(d)});

b.className='gpsbar '+(pos.acc<=50?'ok':'bad');b.textContent='📍 '+pos.lat.toFixed(6)+', '+pos.lon.toFixed(6)+' (±'+pos.acc+' m)'+(pos.acc>50?' — precisão baixa, espere melhorar':'')+(end.txt?' · '+end.txt:'')}

 ctx.fillText(DIAS[d.getDay()],x+wH+u*4,yH-u*.5);
 ctx.textAlign='right';ctx.font='500 '+(u*2.8)+'px Arial, sans-serif';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText('Técnico: '+s.tec,W-u*3,yH-u*.5);

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function quebra(c,t,m){var ps=t.split(' '),l=[],a='';ps.forEach(function(p){var n=a?a+' '+p:p;if(c.measureText(n).width>m&&a){l.push(a);a=p}else a=n});if(a)l.push(a);return l.slice(0,2)}

async function preparar(i,f,origem){var o=obraAtual(),c=cxAtual();if(!o||!c)return;var quando=new Date();var p=pos?{lat:pos.lat,lon:pos.lon,acc:pos.acc}:null;
var endTxt='';if(origem==='camera'&&p){msg('Gerando carimbo…');endTxt=await Promise.race([buscarEnd(p.lat,p.lon),new Promise(function(r){setTimeout(function(){r(end.txt)},4000)})])||'';msg('')}
var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var M=1600,s=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);var ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
if(origem==='camera')carimbar(ctx,cv.width,cv.height,{data:quando,coord:p?'Coordenadas: '+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+' (±'+p.acc+' m)':'Coordenadas: sem GPS',end:endTxt,caixa:c.nome||'CAIXA NOVA',obra:o.codigo+' · '+o.cidade+'/'+o.uf,n:i+1,tot:ROT[c.tipo].length,tec:$('tec').value.trim()||'-'});
var du=cv.toDataURL('image/jpeg',.85);fotos[i]={b64:du.split(',')[1],prev:du,nome:String(f.name||'foto').replace(/\.[^.]+$/,''),origem:origem,geo:p?[p.lon,p.lat,p.acc]:null,em:quando.toISOString(),end:endTxt};URL.revokeObjectURL(u);
if(origem==='camera'&&!p)msg('Foto '+(i+1)+' ficou sem GPS. Ative a localização e tire de novo, senão o escritório não consegue enviar.','bad');render();salvar(true)};
img.onerror=function(){msg('Não consegui abrir essa foto. Tente outra.','bad')};img.src=u}

function run(fn){var a=[].slice.call(arguments,1);return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a})}).then(function(r){if(!r.ok)throw new Error('servidor respondeu '+r.status);return r.json()}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.erro||'erro no servidor');return j.r})}
$('enviar').onclick=async function(){var o=obraAtual(),c=cxAtual();if(!o||!c)return;var tec=$('tec').value.trim();if(!tec){msg('Preencha seu nome ou equipe.','bad');$('tec').focus();return}
var en=erroNova(c);if(en){msg(en,'bad');return}try{localStorage.setItem('tec3w',tec)}catch(e){}
var b=this;b.disabled=true;var n=ROT[c.tipo].length;

var meta={obraId:o.id,codigo:o.codigo,cidade:o.cidade,caixaId:c.id,caixaNome:c.nome,tipo:c.tipo,novo:!!c.novo,tecnico:tec,obs:$('obs').value.trim(),gps:geos[0]||gps,endereco:(fotos[0]&&fotos[0].end)||end.txt||'',carimbo:'3W v2',app:'v4',slots:{},fotosInfo:{}};
try{b.textContent='Guardando…';var item={uid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),meta:meta,n:n,fotos:[],nomes:[],envioId:null,feitos:{},criado:new Date().toISOString(),rotulo:c.nome+' · '+o.cidade};
for(var i=0;i<n;i++){item.fotos.push(fotos[i].b64);item.nomes.push(fotos[i].nome);meta.fotosInfo['f'+(i+1)]={origem:fotos[i].origem,geo:fotos[i].geo,em:fotos[i].em}}
var fl=await filaLer();fl.push(item);if(!(await filaGravar(fl)))throw new Error('o celular não deixou guardar as fotos (memória cheia?)');
marcarEnvLocal(c.id,'pendente');
if(c.novo)o.caixas.push({id:c.id,nome:c.nome,tipo:c.tipo,enviada:true,novo:true});
fotos={};$('obs').value='';$('novaNome').value='';$('cx').value='';$('cx').dataset.ant='';await limparRascunho();
b.textContent='Enviar fotos';telaFim(o,c);filaBar();sincronizar()}
catch(e){b.disabled=false;b.textContent='Enviar fotos';render();msg('Não foi possível guardar: '+(e&&e.message||e)+'. As fotos continuam na tela, tente de novo.','bad')}};

function telaFim(o,c){var falta=pendentes(o),outras=obras.filter(function(x){return x!==o&&pendentes(x).length});
var h='';if(!falta.length){h='<div class="done"><b>Todas as caixas prontas ✓</b>Todas as caixas de '+o.cidade+' ('+o.codigo+') estão feitas.<p class="note">As fotos vão para o escritório sozinhas assim que o celular tiver internet. Última: '+c.nome+'. Obrigado!</p>'+
'<button class="big" id="fNova">➕ Cadastrar caixa nova nesta obra</button>'+(outras.length?'<button class="big sec" id="fCid">Enviar de outra cidade</button>':'')+'</div>'}
else{h='<div class="done"><b>Fotos guardadas ✓</b><span class="note">Vão para o escritório sozinhas assim que o celular tiver internet.</span><br>'+c.nome+'<br>'+o.cidade+'<p class="note">Falta'+(falta.length>1?'m ':' ')+falta.length+' caixa'+(falta.length>1?'s':'')+' nesta obra:</p><ul>'+falta.map(function(x){return'<li>'+x.nome+'</li>'}).join('')+'</ul>'+
'<button class="big" id="fOutra">Enviar outra caixa</button><button class="big sec" id="fNova">➕ Cadastrar caixa nova (rompimento)</button></div>'}
$('done').innerHTML=h;$('done').hidden=false;$('form').hidden=true;$('enviar').hidden=true;window.scrollTo(0,0);
var volta=function(cx){var ob=$('obra').value;$('done').hidden=true;$('form').hidden=false;msg('');montarCidades();$('cid').onchange();if(ob){$('obra').value=ob;if($('obra').value===ob)montarCx()}if(cx){$('cx').value=cx;$('cx').dataset.ant=cx;render()}salvar(true);window.scrollTo(0,0)};

/* ---------- Fila offline: caixas guardadas no celular até ter internet ---------- */
function filaLer(){return kvGet('fila').then(function(f){return Array.isArray(f)?f:[]})}
function filaGravar(f){return kvSet('fila',f)}
var sincronizando=false,ultimoErro='';
function filaBar(){filaLer().then(function(f){var el=$('filaBar');if(!f.length){if(el.dataset.teve){el.className='fila ok';el.innerHTML='✓ Tudo enviado para o escritório.';el.hidden=false;setTimeout(function(){el.hidden=true;el.dataset.teve=''},6000)}else el.hidden=true;return}
el.dataset.teve='1';el.className='fila';el.hidden=false;
el.innerHTML='📤 '+f.length+' caixa'+(f.length>1?'s':'')+' guardada'+(f.length>1?'s':'')+' no celular'+(sincronizando?', enviando…':navigator.onLine?(ultimoErro?' (sinal fraco, tentando de novo)':''):', aguardando internet')+(sincronizando?'':'<button type="button" id="filaJa">Enviar agora</button>');
var bj=$('filaJa');if(bj)bj.onclick=function(){ultimoErro='';sincronizar()}})}
async function sincronizar(){if(sincronizando)return;if(!API||API.indexOf('http')!==0)return;sincronizando=true;filaBar();
try{var f=await filaLer();
while(f.length){var it=f[0];
 if(!it.envioId){it.envioId=await run('novoEnvio',{obraId:it.meta.obraId,caixaId:it.meta.caixaId,tecnico:it.meta.tecnico,uid:it.uid});await filaGravar(f)}
 for(var i=0;i<it.n;i++){var k='f'+(i+1);if(it.feitos[k])continue;it.feitos[k]=await run('salvarFoto',it.envioId,i+1,it.fotos[i],it.nomes[i]);it.fotos[i]=null;await filaGravar(f);filaBar()}
 it.meta.slots=it.feitos;var r=await run('finalizar',it.envioId,it.meta);
 if(r&&r.enviadas)juntarEnv(r.enviadas);marcarEnvLocal(it.meta.caixaId,it.envioId);
 f.shift();await filaGravar(f)}
 ultimoErro=''}
catch(e){ultimoErro=String(e&&e.message||e)}
finally{sincronizando=false;filaBar()}}
window.addEventListener('online',function(){sincronizar();atualizarDados()});
setInterval(function(){filaLer().then(function(f){if(f.length&&navigator.onLine)sincronizar()})},60000);
function atualizarDados(){if(!API||API.indexOf('http')!==0)return;var ctl=window.AbortController?new AbortController():null;var t=setTimeout(function(){ctl&&ctl.abort()},15000);
fetch(API+'?api=dados',ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(d){clearTimeout(t);if(!d||!d.obras)return;var novo=JSON.stringify(d),velho=localStorage.getItem('dados3w');
try{localStorage.setItem('dados3w',novo)}catch(e){}
if(novo!==velho){var ocupado=Object.keys(fotos).length||$('cx').value!=='';if(SEM_DADOS||!ocupado)location.reload();else msg('Lista de obras atualizada. Ela aparece quando você terminar esta caixa.','ok')}}).catch(function(){clearTimeout(t);if(SEM_DADOS)msg('Primeira vez: abra o app com internet para baixar a lista de obras. Depois ele funciona sem sinal.','bad')})}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
filaBar();atualizarDados();setTimeout(sincronizar,3000);

$('cx').value=r.cx;if($('cx').value!==r.cx&&r.cx!==NOVA){mostrarEnv=true;opcoesCx();$('cx').value=r.cx}$('cx').dataset.ant=$('cx').value}
$('obs').value=r.obs||'';var c=cxAtual(),n=0;

render();if(n)msg('Recuperei '+n+' foto'+(n>1?'s':'')+' de '+(c.nome||'caixa nova')+' que você já tinha tirado. É só continuar.','ok')}catch(e){}restaurando=false})
